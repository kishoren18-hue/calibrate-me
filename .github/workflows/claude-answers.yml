name: ask claude

# Manual: Actions tab -> "ask claude" -> Run workflow. Needs the repository
# secret ANTHROPIC_API_KEY. Commits src/data/claude-answers.json.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model ID"
        default: "claude-sonnet-5-5"
        required: true

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ask Claude every question
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: python scripts/ask_claude.py --model "$MODEL"
      - name: Commit results
        env:
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/claude-answers.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Claude answers ($MODEL)"
          git push
